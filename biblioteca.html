<body data-nav="biblioteca">
    <div id="toast-container" role="status" aria-live="polite"></div>

    <header></header>

    <main class="container" id="contenedor-biblioteca">
        <p style="text-align: center; color: var(--text-muted);">Cargando biblioteca...</p>
    </main>

    <div id="modales-herramientas"></div>

    <script src="app.js"></script>
    <script>
        (async function cargarModales() {
            try {
                const res = await fetch('modales.html');
                if (res.ok) {
                    document.getElementById('modales-herramientas').innerHTML = await res.text();
                }
            } catch (e) {
                console.warn('No se pudieron cargar los modales:', e);
            }
        })();
    </script>
