<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Recursos | eLDeSiempre.es</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="toast-container"></div>

    <header>
        <div class="logo-container" onclick="window.location.href='index.html'">
            <img src="assets/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="logo-text">eLDeSiempre<span>.es</span></div>
        </div>
        <nav>
            <button class="nav-btn" onclick="window.location.href='herramientas.html'">Herramientas</button>
            <button class="nav-btn active" onclick="window.location.href='recursos.html'">Recursos</button>
            <button class="nav-btn" onclick="window.location.href='contacto.html'">Contacto</button>
            <button class="nav-btn" id="nav-perfil-btn" style="display:none;" onclick="window.location.href='perfil.html'">Mi Perfil</button>
            <button class="nav-btn btn-login" id="nav-login-btn" onclick="window.location.href='login.html'">Acceder</button>
            <button class="nav-btn" id="nav-logout-btn" style="display:none; color:var(--danger); border-color:var(--danger);" onclick="cerrarSesion()">Salir</button>
            <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
        </nav>
    </header>

    <main class="container" id="contenedor-recursos" style="display: none;">
    </main>
    
    <script src="app.js"></script>
</body>
</html>
