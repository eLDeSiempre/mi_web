<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://api.eldesiempre.es https://matomo.eldesiempre.es https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://www.nerdfonts.com https://fonts.googleapis.com https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://matomo.eldesiempre.es https://api.eldesiempre.es; img-src 'self' data: https:; font-src 'self' https://www.nerdfonts.com https://fonts.gstatic.com;">
    <title>Restablecer Contraseña | eLDeSiempre.es</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="toast-container"></div>

    <header>
        <div class="logo-container" onclick="window.location.href='index.html'">
            <img src="assets/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="logo-text">eLDeSiempre<span>.es</span></div>
        </div>
        <nav>
            <button class="nav-btn" onclick="window.location.href='herramientas.html'">Herramientas</button>
            <button class="nav-btn" onclick="window.location.href='recursos.html'">Recursos</button>
            <button class="nav-btn" onclick="window.location.href='contacto.html'">Contacto</button>
            <button class="nav-btn" id="nav-perfil-btn" style="display:none;" onclick="window.location.href='perfil.html'">Mi Perfil</button>
            <button class="nav-btn btn-login" id="nav-login-btn" onclick="window.location.href='login.html'">Acceder</button>
            <button class="nav-btn" id="nav-logout-btn" style="display:none; color:var(--danger); border-color:var(--danger);" onclick="cerrarSesion()">Salir</button>
            <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
        </nav>
    </header>

    <main class="container" id="main-content" style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
        <form class="auth-form" id="form-reset">
            <h2>Nueva Contraseña</h2>
            <p style="text-align: center; margin-bottom: 20px; font-size: 0.9rem; color: var(--text-muted);">Introduce tu nueva contraseña. Debe tener al menos 8 caracteres.</p>
            
            <div class="form-field">
                <label for="reset-password">Contraseña</label>
                <input type="password" id="reset-password" placeholder="••••••••" required minlength="8" autocomplete="new-password">
            </div>
            
            <div class="form-field">
                <label for="reset-password-confirm">Confirmar Contraseña</label>
                <input type="password" id="reset-password-confirm" placeholder="••••••••" required minlength="8" autocomplete="new-password">
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%;">Cambiar Contraseña</button>
        </form>
    </main>

    <script src="app.js"></script>
    <script>
        document.getElementById('form-reset').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                mostrarToast("Token no válido o ausente.", "error");
                return;
            }

            const pass = document.getElementById('reset-password').value;
            const passConfirm = document.getElementById('reset-password-confirm').value;

            if (pass !== passConfirm) {
                mostrarToast("Las contraseñas no coinciden.", "error");
                return;
            }

            try {
                const response = await fetch('https://api.eldesiempre.es/reset_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, password: pass })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    mostrarToast("Contraseña actualizada. Redirigiendo al login...", "success");
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    mostrarToast(result.message, "error");
                }
            } catch (error) {
                mostrarToast("Error de conexión.", "error");
            }
        });
    </script>
</body>
</html>
