<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contacto | eLDeSiempre.es</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    <div id="toast-container" role="status" aria-live="polite"></div>

    <header>
        <button class="logo-container" onclick="window.location.href='index.html'">
            <img src="assets/logo.png" alt="" class="logo-img" onerror="this.style.display='none'">
            <div class="logo-text">eLDeSiempre<span>.es</span></div>
        </button>
        <nav>
            <button class="nav-btn" onclick="window.location.href='herramientas.html'">Herramientas</button>
            <button class="nav-btn" onclick="window.location.href='recursos.html'">Recursos</button>
            <button class="nav-btn active" onclick="window.location.href='contacto.html'">Contacto</button>
            <button class="nav-btn" id="nav-perfil-btn" style="display:none;" onclick="window.location.href='perfil.html'">Mi Perfil</button>
            <button class="nav-btn btn-login" id="nav-login-btn" onclick="window.location.href='login.html'">Acceder</button>
            <button class="nav-btn" id="nav-logout-btn" style="display:none; color:var(--danger); border-color:var(--danger);" onclick="cerrarSesion()">Salir</button>
            <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
        </nav>
    </header>

    <main class="container" id="main-content">
        <h2>Contacto</h2>
        <p style="margin-bottom: 25px; text-align: center;">¿Tienes alguna consulta o has encontrado un error? Escríbenos.</p>

        <form class="contact-form" id="form-contacto">
            <div style="display:none;"><input type="text" id="contact-website"></div>
            <div class="form-field">
                <label for="contact-nombre">Tu Nombre</label>
                <input type="text" id="contact-nombre" placeholder="Nombre" required>
            </div>
            <div class="form-field">
                <label for="contact-email">Tu Correo</label>
                <input type="email" id="contact-email" placeholder="tu@correo.com" required>
            </div>
            <div class="form-field">
                <label for="contact-asunto">Asunto</label>
                <input type="text" id="contact-asunto" placeholder="Asunto" required>
            </div>
            <div class="form-field">
                <label for="contact-mensaje">Mensaje</label>
                <textarea id="contact-mensaje" placeholder="Tu mensaje..." required></textarea>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%;">Enviar Mensaje</button>
            <div id="contact-result" class="tool-result"></div>
        </form>
    </main>

    <script>
        document.getElementById('form-contacto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                nombre: document.getElementById('contact-nombre').value,
                email: document.getElementById('contact-email').value,
                asunto: document.getElementById('contact-asunto').value,
                mensaje: document.getElementById('contact-mensaje').value,
                website: document.getElementById('contact-website').value
            };
            try {
                const response = await fetch(`https://api.eldesiempre.es/contacto.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (result.success) {
                    mostrarToast('Mensaje enviado con éxito.', 'success');
                    document.getElementById('form-contacto').reset();
                } else {
                    mostrarToast('Error al enviar: ' + result.message, 'error');
                }
            } catch (error) {
                mostrarToast('Error de conexión.', 'error');
            }
        });
    </script>
    <script src="app.js"></script>
</body>
</html>
