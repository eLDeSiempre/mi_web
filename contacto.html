<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contacto | eLDeSiempre.es</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="toast-container"></div>

    <header>
        <div class="logo-container" onclick="window.location.href='index.html'">
            <img src="assets/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="logo-text">eLDeSiempre<span>.es</span></div>
        </div>
        <nav>
            <button class="nav-btn" onclick="window.location.href='herramientas.html'">Herramientas</button>
            <button class="nav-btn" onclick="window.location.href='recursos.html'">Recursos</button>
            <button class="nav-btn active" onclick="window.location.href='contacto.html'">Contacto</button>
            <button class="nav-btn btn-login" id="nav-login-btn" onclick="window.location.href='login.html'">Acceder</button>
            <button class="nav-btn" id="nav-logout-btn" style="display:none; color:#ff3333; border-color:#ff3333;" onclick="cerrarSesion()">Salir</button>
        </nav>
    </header>

    <main class="container">
        <h2>Contacto</h2>
        <p style="margin-bottom: 30px; text-align: center;">¿Tienes alguna consulta, observación o has encontrado un error en la página? Escríbenos y te responderemos lo antes posible.</p>
        
        <form class="contact-form" id="form-contacto">
            <input type="text" id="contact-nombre" placeholder="Tu Nombre" required>
            <input type="email" id="contact-email" placeholder="Tu Correo Electrónico" required>
            <input type="text" id="contact-asunto" placeholder="Asunto (Ej: Corrección, Duda, etc.)" required>
            <textarea id="contact-mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>
            <button type="submit" class="btn-primary" style="width: 100%;">Enviar Mensaje</button>
        </form>
    </main>

    <script>
        document.getElementById('form-contacto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                nombre: document.getElementById('contact-nombre').value,
                email: document.getElementById('contact-email').value,
                asunto: document.getElementById('contact-asunto').value,
                mensaje: document.getElementById('contact-mensaje').value
            };
            try {
                const response = await fetch(`https://api.eldesiempre.es/contacto.php`, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, 
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (result.success) {
                    mostrarToast('Mensaje enviado con éxito.', 'success');
                    document.getElementById('form-contacto').reset();
                } else { mostrarToast('Error al enviar: ' + result.message, 'error'); }
            } catch (error) { 
                mostrarToast('Error de conexión. Inténtalo más tarde.', 'error'); 
            }
        });
    </script>
    <script src="app.js"></script>
</body>
</html>
