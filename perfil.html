<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://api.eldesiempre.es https://matomo.eldesiempre.es https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://www.nerdfonts.com https://fonts.googleapis.com https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://matomo.eldesiempre.es https://api.eldesiempre.es; img-src 'self' data: https:; font-src 'self' https://www.nerdfonts.com https://fonts.gstatic.com;">
    <title>Mi Perfil | eLDeSiempre.es</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="toast-container"></div>

    <header>
        <div class="logo-container" onclick="window.location.href='index.html'">
            <img src="assets/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="logo-text">eLDeSiempre<span>.es</span></div>
        </div>
        <nav>
            <button class="nav-btn" onclick="window.location.href='herramientas.html'">Herramientas</button>
            <button class="nav-btn" onclick="window.location.href='recursos.html'">Recursos</button>
            <button class="nav-btn" onclick="window.location.href='contacto.html'">Contacto</button>
            <button class="nav-btn active" id="nav-perfil-btn" style="display:none;" onclick="window.location.href='perfil.html'">Mi Perfil</button>
            <button class="nav-btn btn-login" id="nav-login-btn" onclick="window.location.href='login.html'">Acceder</button>
            <button class="nav-btn" id="nav-logout-btn" style="display:none; color:var(--danger); border-color:var(--danger);" onclick="cerrarSesion()">Salir</button>
            <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
        </nav>
    </header>

    <main class="container" style="display: none;">
        <h2>Mi Perfil Profesional</h2>
        <div class="profile-card">
            <h2 style="color: var(--neon-green); text-align: center; border: none; margin-bottom: 10px;">@<span id="perfil-usuario">usuario</span></h2>
            <p style="text-align: center; margin-bottom: 30px; font-size: 1.1rem;">Bienvenido de nuevo, <strong id="perfil-nombre" style="color: var(--text-bright);">Nombre</strong>.</p>
            
            <form class="profile-form" id="form-perfil" style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label for="perfil-bio">Biografía</label>
                    <textarea id="perfil-bio" placeholder="Cuéntanos sobre ti..." style="width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border); color: var(--text-bright); border-radius: 6px; font-family: inherit; min-height: 100px;"></textarea>
                </div>
                <div>
                    <label for="perfil-habilidades">Habilidades</label>
                    <input type="text" id="perfil-habilidades" placeholder="Pentesting, OSINT..." style="width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border); color: var(--text-bright); border-radius: 6px; font-family: inherit;">
                </div>
                <div>
                    <label for="perfil-github">GitHub (URL)</label>
                    <input type="url" id="perfil-github" placeholder="https://github.com/..." style="width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border); color: var(--text-bright); border-radius: 6px; font-family: inherit;">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Guardar Cambios</button>
            </form>

            <a href="https://discord.gg/EakygHQwUu" target="_blank" class="btn-discord">Unirse al Discord</a>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
